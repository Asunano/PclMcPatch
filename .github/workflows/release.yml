name: Build and Release

on:
  push:
    tags:
      - 'v*'          # 推送形如 v1.0.0 的标签时自动构建并发布
  workflow_dispatch:  # 允许在 Actions 页面手动触发

permissions:
  contents: write    # 需要写权限以创建 Release

jobs:
  build:
    name: Build (win-x64) and Release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/PclMcPatch.csproj

      - name: Publish (win-x64, single-file, framework-dependent)
        run: >
          dotnet publish src/PclMcPatch.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
          -o ./publish

      - name: Package artifacts into zip
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if ($version -like 'v*') { $version = $version.Substring(1) }
          $zip = "PclMcPatch-$version.zip"
          Compress-Archive -Path ./publish/PclMcPatch.exe, ./README.md -DestinationPath $zip -Force
          echo "ZIP_NAME=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          name: PclMcPatch ${{ github.ref_name }}
          body: |
            ## PCL2 我的世界本体下载 · 一键补丁 / 启动器外壳

            ### 用法
            - **启动器模式**：把 `PclMcPatch.exe` 放到 PCL2 主程序同目录，双击它即可（自动补丁 + 启动 PCL2）。
            - **手动模式**：把 PCL2 主程序拖到 `PclMcPatch.exe` 上。

            ### 校验
            - 单文件、框架依赖（需 .NET 8 桌面运行时，PCL2 本身已需要）。
            - 自动备份原文件为 `*.bak`，已补丁版本重复运行安全跳过。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
